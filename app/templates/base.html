<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app_name') }}{% endblock %}</title>
  <link rel="preload" href="/static/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">{{ t('app_name') }}</a>
    <nav>
      <a href="/matches">{{ t('matches_title') }}</a>
      <a href="/leaderboard">{{ t('leaderboard_title') }}</a>
      {% if user %}
        <a href="/profile">{{ user.nickname }}</a>
      {% else %}
        <a href="/login">{{ t('nav_login') }}</a>
      {% endif %}
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer"><a href="/rules">{{ t('rules_title') }}</a></footer>
  <script src="/static/js/timezone.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
