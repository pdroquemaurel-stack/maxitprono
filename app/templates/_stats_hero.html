{# Carte héro : anneau de réussite et points. Variables : s (Summary), hero_sub #}
  {% set circumference = 289.03 %}
  <section class="p-hero">
    <svg class="p-ring" viewBox="0 0 104 104" width="104" height="104" role="img"
         aria-label="{{ t('profile_success_aria').format(rate=s.success_rate) }}">
      <circle cx="52" cy="52" r="46" fill="none" stroke="#33363F" stroke-width="10"/>
      {% if s.success_rate %}
        <circle class="p-ring-arc" cx="52" cy="52" r="46" fill="none" style="stroke: var(--color-primary)" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="{{ circumference }}"
                stroke-dashoffset="{{ '%.2f' % (circumference * (100 - s.success_rate) / 100) }}"
                transform="rotate(-90 52 52)"/>
      {% endif %}
      <text x="52" y="52" text-anchor="middle" class="p-ring-value">{{ s.success_rate }} %</text>
      <text x="52" y="70" text-anchor="middle" class="p-ring-label">{{ t('profile_success') }}</text>
    </svg>
    <div class="p-hero-text">
      <p class="p-hero-label">{{ t('profile_points') }}</p>
      <p class="p-hero-points">{{ s.points }}</p>
      <p class="p-hero-sub">{{ hero_sub }}</p>
    </div>
  </section>
