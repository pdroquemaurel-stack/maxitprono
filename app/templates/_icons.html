{# Icônes SVG au trait (2 px), couleur du texte courant #}
{% macro icon(name, size=24) %}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" aria-hidden="true" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  {% if name == 'gear' %}
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
  {% elif name == 'share' %}
    <path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
  {% elif name == 'swords' %}
    <path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/>
    <path d="M9.5 6.5 14 2h3v3l-4.5 4.5"/>
  {% elif name == 'lock' %}
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {% elif name == 'eye' %}
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
  {% elif name == 'trend' %}
    <path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>
  {% elif name == 'people' %}
    <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
    <path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.4c2.2.8 3.5 2.8 3.5 5.6"/>
  {% elif name == 'shield' %}
    <path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
  {% elif name == 'back' %}
    <path d="M15 5l-7 7 7 7"/>
  {% elif name == 'chevron' %}
    <path d="M9 5l7 7-7 7"/>
  {% elif name == 'plus' %}
    <path d="M12 5v14M5 12h14"/>
  {% elif name == 'crown' %}
    <path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>
  {% elif name == 'copy' %}
    <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
  {% elif name == 'dots' %}
    <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
  {% elif name == 'message' %}
    <path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/>
  {% elif name == 'check' %}
    <path d="M4.5 12.5l5 5L19.5 7"/>
  {% elif name == 'clock' %}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == 'ball' %}
    <circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5 7 18.5M8 10 3.5 8.5"/>
  {% elif name == 'lock_dashed' %}
    <rect x="5" y="11" width="14" height="10" rx="2" stroke-dasharray="3 2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-dasharray="3 2.5"/>
  {% endif %}
</svg>
{% endmacro %}

{# Ballon décoratif en filigrane du héro (trait fin, couleur #23262E via la classe) #}
{% macro ball_watermark(size=220) %}
<svg class="hg-ball" viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" aria-hidden="true" fill="none"
     stroke="currentColor" stroke-width="3" stroke-linejoin="round">
  <circle cx="50" cy="50" r="46"/>
  <path d="M50 30l17 12-6.5 20h-21L33 42z"/>
  <path d="M50 30V8M67 42l20-8M60.5 62l12 18M39.5 62l-12 18M33 42l-20-8"/>
</svg>
{% endmacro %}
