# Blueprint Render : base Postgres + web service FastAPI
databases:
  - name: maxitprono-db
    plan: free
    region: frankfurt
    databaseName: maxitprono
    user: maxitprono

services:
  - type: web
    name: maxitprono
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Les migrations sont appliquées à chaque démarrage
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: maxitprono-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_LANGUAGE
        value: fr
      - key: SECURE_COOKIES
        value: "true"
      - key: API_FOOTBALL_KEY
        sync: false  # à saisir dans le tableau de bord Render
